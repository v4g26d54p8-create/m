<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF2F1;
    --bg-panel: #FFFFFF;
    --bg-raised: #E4EBE9;
    --ink: #142420;
    --ink-soft: #4B5C57;
    --line: #C9D4D0;
    --amber: #C97B3D;
    --amber-ink: #7A431A;
    --teal: #2E7D6B;
    --teal-ink: #1B4A40;
    --good: #2E7D4F;
    --good-bg: #E1F3E6;
    --bad: #B3402F;
    --bad-bg: #FBE6E1;
    --radius: 3px;
    --shadow: 0 1px 0 rgba(20,36,32,.06);
  }
  [data-theme="dark"]{
    --bg: #0D1B2A;
    --bg-panel: #12263B;
    --bg-raised: #172E45;
    --ink: #E8EEEC;
    --ink-soft: #9FB3C8;
    --line: #24435F;
    --amber: #E0A458;
    --amber-ink: #F3CE9C;
    --teal: #4FB3A0;
    --teal-ink: #9BDACB;
    --good: #6FCB8F;
    --good-bg: #143324;
    --bad: #E38070;
    --bad-bg: #3A1912;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    line-height:1.65;
    transition:background .25s ease, color .25s ease;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  .grid-bg{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity:.35;
  }

  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
  }
  .header-row{
    max-width:980px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border:2px solid var(--amber);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--amber);
    flex-shrink:0;
  }
  .brand h1{font-size:17px; margin:0; font-weight:800;}
  .brand p{margin:0; font-size:12px; color:var(--ink-soft);}

  .controls{display:flex; gap:8px;}
  .ctrl-btn{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    font-family:'Manrope',sans-serif;
    font-size:13px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:border-color .15s ease, transform .1s ease;
  }
  .ctrl-btn:hover{border-color:var(--amber);}
  .ctrl-btn:active{transform:scale(.96);}

  main{max-width:980px; margin:0 auto; padding:28px 20px 80px;}

  .mode-toggle{
    display:flex; border:1px solid var(--line); border-radius:24px; overflow:hidden;
    width:fit-content; margin:0 auto 26px; background:var(--bg-panel);
  }
  .mode-toggle button{
    padding:10px 26px; border:none; background:transparent; color:var(--ink-soft);
    font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
    transition:all .15s ease;
  }
  .mode-toggle button.active{background:var(--teal); color:#fff;}

  .rail{
    display:flex; align-items:stretch; gap:0; margin-bottom:28px;
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    background:var(--bg-panel);
  }
  .rail-item{
    flex:1; padding:16px 14px; cursor:pointer; text-align:center;
    border-left:1px solid var(--line);
    position:relative;
    transition:background .15s ease;
  }
  .rail-item:first-child{border-left:none;}
  .rail-item:hover{background:var(--bg-raised);}
  .rail-item.active{background:var(--bg-raised);}
  .rail-item.active::after{
    content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--amber);
  }
  .rail-num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber-ink);
    display:block; margin-bottom:4px; letter-spacing:.05em;
  }
  .rail-title{font-size:14px; font-weight:700;}

  .subnav{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; align-items:center;}
  .subnav button{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:9px 16px; border-radius:20px; font-family:'Manrope',sans-serif; font-size:13.5px;
    cursor:pointer; transition:all .15s ease;
  }
  .subnav button.active{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700;}
  .subnav button:hover:not(.active){border-color:var(--teal);}
  .shuffle-btn{
    margin-left:auto;
    background:none; border:1px dashed var(--amber); color:var(--amber-ink);
    padding:9px 16px; border-radius:20px; font-family:'Manrope',sans-serif; font-size:13px;
    cursor:pointer;
  }

  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .score-pill{
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    background:var(--bg-raised); border:1px solid var(--line); padding:6px 12px; border-radius:20px;
  }
  .score-pill b{color:var(--amber-ink);}

  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .q-index{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber-ink);
    margin-bottom:6px; display:block;
  }
  .q-text{font-size:16px; font-weight:700; margin:0 0 14px;}

  .opt{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; margin-bottom:8px;
    border:1px solid var(--line); border-radius:var(--radius);
    cursor:pointer; font-size:14.5px;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover{border-color:var(--teal);}
  .opt .tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .opt.chosen{border-color:var(--teal); background:var(--bg-raised);}
  .opt.correct{border-color:var(--good); background:var(--good-bg);}
  .opt.correct .tag{border-color:var(--good); color:var(--good);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .opt.wrong .tag{border-color:var(--bad); color:var(--bad);}
  .opt.disabled{cursor:default;}

  .tf-row{display:flex; gap:10px; margin-bottom:14px;}
  .tf-btn{
    flex:1; padding:10px; border:1px solid var(--line); border-radius:var(--radius);
    background:transparent; color:var(--ink); font-family:'Manrope',sans-serif; font-size:14px;
    cursor:pointer; transition:all .12s ease;
  }
  .tf-btn:hover{border-color:var(--teal);}
  .tf-btn.chosen{border-color:var(--teal); background:var(--bg-raised); font-weight:700;}
  .tf-btn.correct{border-color:var(--good); background:var(--good-bg); color:var(--good); font-weight:700;}
  .tf-btn.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad); font-weight:700;}

  .explain{
    font-size:13.5px; color:var(--ink-soft); border-left:3px solid var(--amber);
    padding:8px 12px; margin-top:6px; background:var(--bg-raised); border-radius:0 var(--radius) var(--radius) 0;
    display:none;
  }
  .explain.show{display:block;}

  .essay-toggle{
    background:transparent; border:1px dashed var(--line); color:var(--teal-ink);
    padding:8px 14px; border-radius:var(--radius); cursor:pointer; font-family:'Manrope',sans-serif; font-size:13.5px;
  }
  .essay-ans{
    display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-size:14.5px; color:var(--ink-soft);
  }
  .essay-ans.show{display:block;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin:20px 0 6px; flex-wrap:wrap; gap:10px;}
  .reset-btn{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; font-family:'Manrope',sans-serif; font-size:13px;
  }

  footer{
    text-align:center; color:var(--ink-soft); font-size:12px; padding:20px; border-top:1px solid var(--line);
  }

  /* Exam mode */
  .exam-setup{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; text-align:center; margin-bottom:20px;
  }
  .exam-setup h2{margin:0 0 8px; font-size:19px;}
  .exam-setup p{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}
  .exam-scope{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px;
  }
  .exam-scope button{
    padding:10px 18px; border:1px solid var(--line); border-radius:20px; background:transparent;
    color:var(--ink); font-family:'Manrope',sans-serif; font-size:13.5px; cursor:pointer;
  }
  .exam-scope button.active{background:var(--amber); border-color:var(--amber); color:#fff; font-weight:700;}
  .start-exam-btn{
    background:var(--teal); color:#fff; border:none; padding:13px 32px; border-radius:var(--radius);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
  }
  .start-exam-btn:hover{opacity:.92;}
  .exam-progress{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:16px;
  }
  .exam-section-label{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal-ink);
    text-transform:uppercase; letter-spacing:.06em; margin:22px 0 10px;
    border-top:1px solid var(--line); padding-top:16px;
  }
  .exam-section-label:first-child{border-top:none; padding-top:0;}
  .submit-exam-btn{
    background:var(--amber); color:#fff; border:none; padding:14px 32px; border-radius:var(--radius);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; cursor:pointer; display:block; margin:24px auto 0;
  }
  .submit-exam-btn:hover{opacity:.92;}
  .exam-result{
    text-align:center; background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px; margin-bottom:24px;
  }
  .exam-result .big-score{font-family:'IBM Plex Mono',monospace; font-size:40px; font-weight:600; color:var(--amber-ink);}
  .exam-result p{color:var(--ink-soft); font-size:14px;}
  .retake-btn{
    background:var(--teal); color:#fff; border:none; padding:11px 24px; border-radius:var(--radius);
    font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-top:10px;
  }

  @media (max-width:640px){
    .rail{flex-direction:column;}
    .rail-item{border-left:none; border-top:1px solid var(--line);}
    .rail-item:first-child{border-top:none;}
    .brand h1{font-size:15px;}
    .shuffle-btn{margin-left:0;}
  }
</style>
</head>
<body data-theme="light">
<div class="grid-bg"></div>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">T</div>
      <div>
        <h1>Technology Exam Prep</h1>
        <p>Question bank for all 3 modules</p>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="themeBtn">🌙 Dark</button>
    </div>
  </div>
</header>

<main>
  <div class="mode-toggle" id="modeToggle">
    <button data-mode="study" class="active">Study</button>
    <button data-mode="exam">Exam</button>
  </div>

  <div id="studyView">
    <div class="rail" id="rail"></div>
    <div class="subnav" id="subnav"></div>
    <div class="panel-head">
      <span id="panelTitle" style="font-weight:700; font-size:15px;"></span>
      <span class="score-pill mono" id="scorePill" style="display:none;">Score: <b id="scoreVal">0/0</b></span>
    </div>
    <div id="content"></div>
    <div class="toolbar" id="toolbar" style="display:none;">
      <button class="reset-btn" id="resetBtn">Reset answers ↺</button>
    </div>
  </div>

  <div id="examView" style="display:none;"></div>
</main>

<footer>Randomized question order and answer positions every attempt — memorize the concept, not the pattern.</footer>

/* ================= HELPERS ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const LETTERS = ['A','B','C','D'];

/* ================= STATE ================= */
let state = {
  theme: 'light',
  mode: 'study',
  module: 'm1',
  section: 'mcq',
  answers: {},       // key -> chosen ORIGINAL index/bool
  qOrder: {},         // `${mod}_${sec}` -> [originalIdx,...] shuffled
  optOrder: {}         // `${mod}_mcq_${idx}` -> [originalOptIdx,...] shuffled
};

function ensureQOrder(mod, sec){
  const key = `${mod}_${sec}`;
  if(!state.qOrder[key]){
    const n = DATA[mod][sec].length;
    state.qOrder[key] = shuffle([...Array(n).keys()]);
  }
  return state.qOrder[key];
}
function ensureOptOrder(mod, idx){
  const key = `${mod}_mcq_${idx}`;
  if(!state.optOrder[key]){
    state.optOrder[key] = shuffle([0,1,2,3]);
  }
  return state.optOrder[key];
}
function reshuffleSection(mod, sec){
  const key = `${mod}_${sec}`;
  const n = DATA[mod][sec].length;
  state.qOrder[key] = shuffle([...Array(n).keys()]);
  if(sec==='mcq'){
    DATA[mod].mcq.forEach((_,idx)=>{
      state.optOrder[`${mod}_mcq_${idx}`] = shuffle([0,1,2,3]);
    });
  }
  // clear answers for this section
  Object.keys(state.answers).forEach(k=>{
    if(k.startsWith(`${mod}_${sec}_`)) delete state.answers[k];
  });
}

/* ================= STUDY RENDER ================= */
function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  ['m1','m2','m3'].forEach((key,i)=>{
    const d = DATA[key];
    const div = document.createElement('div');
    div.className = 'rail-item' + (state.module===key ? ' active':'');
    div.innerHTML = `<span class="rail-num mono">0${i+1}</span><span class="rail-title">${d.title} · ${d.subtitle}</span>`;
    div.onclick = ()=>{ state.module=key; state.section='mcq'; renderStudy(); };
    rail.appendChild(div);
  });
}

function renderSubnav(){
  const nav = document.getElementById('subnav');
  nav.innerHTML = '';
  const labels = {mcq:'Multiple Choice', tf:'True / False', essay:'Essay Questions'};
  ['mcq','tf','essay'].forEach(sec=>{
    const btn = document.createElement('button');
    btn.className = state.section===sec ? 'active':'';
    btn.textContent = labels[sec];
    btn.onclick = ()=>{ state.section=sec; renderStudy(); };
    nav.appendChild(btn);
  });
  if(state.section!=='essay'){
    const shuf = document.createElement('button');
    shuf.className='shuffle-btn';
    shuf.textContent='🔀 Shuffle again';
    shuf.onclick = ()=>{ reshuffleSection(state.module, state.section); renderStudy(); };
    nav.appendChild(shuf);
  }
}

function scoreFor(mod, sec){
  const list = DATA[mod][sec];
  let answered=0, correct=0;
  list.forEach((item,idx)=>{
    const key = `${mod}_${sec}_${idx}`;
    if(state.answers[key] !== undefined){
      answered++;
      if(sec==='mcq' && state.answers[key]===item.correct) correct++;
      if(sec==='tf' && state.answers[key]===item.ans) correct++;
    }
  });
  return {answered, correct, total:list.length};
}

function renderContent(){
  const mod = state.module, sec = state.section;
  const content = document.getElementById('content');
  const panelTitle = document.getElementById('panelTitle');
  const scorePill = document.getElementById('scorePill');
  const scoreVal = document.getElementById('scoreVal');
  const toolbar = document.getElementById('toolbar');
  const labels = {mcq:'Multiple Choice', tf:'True / False', essay:'Essay Questions'};
  panelTitle.textContent = `${DATA[mod].title} — ${labels[sec]}`;
  content.innerHTML = '';

  if(sec==='essay'){
    scorePill.style.display='none';
    toolbar.style.display='none';
    const order = ensureQOrder(mod, sec);
    order.forEach((idx, pos)=>{
      const item = DATA[mod].essay[idx];
      const card = document.createElement('div');
      card.className='card';
      const ansId = `essay_${mod}_${idx}`;
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${item.q}</p>
        <button class="essay-toggle" data-target="${ansId}">Show model answer ▾</button>
        <div class="essay-ans" id="${ansId}">${item.a}</div>
      `;
      content.appendChild(card);
    });
    content.querySelectorAll('.essay-toggle').forEach(btn=>{
      btn.onclick = ()=>{
        const el = document.getElementById(btn.dataset.target);
        const showing = el.classList.toggle('show');
        btn.textContent = showing ? 'Hide answer ▴' : 'Show model answer ▾';
      };
    });
    return;
  }

  toolbar.style.display='flex';
  scorePill.style.display='inline-block';
  const sc = scoreFor(mod, sec);
  scoreVal.textContent = `${sc.correct}/${sc.answered} (of ${sc.total})`;

  const order = ensureQOrder(mod, sec);

  if(sec==='mcq'){
    order.forEach((idx, pos)=>{
      const item = DATA[mod].mcq[idx];
      const key = `${mod}_mcq_${idx}`;
      const chosen = state.answers[key];
      const optOrder = ensureOptOrder(mod, idx);
      const card = document.createElement('div');
      card.className='card';
      let optsHtml = optOrder.map((origOi, pos2)=>{
        let cls='opt';
        if(chosen!==undefined){
          cls+=' disabled';
          if(origOi===item.correct) cls+=' correct';
          else if(origOi===chosen) cls+=' wrong';
        }
        return `<div class="${cls}" data-oi="${origOi}"><span class="tag mono">${LETTERS[pos2]}</span><span>${item.opts[origOi]}</span></div>`;
      }).join('');
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${item.q}</p>
        ${optsHtml}
        <div class="explain ${chosen!==undefined?'show':''}">${item.exp}</div>
      `;
      if(chosen===undefined){
        card.querySelectorAll('.opt').forEach(optEl=>{
          optEl.onclick = ()=>{
            state.answers[key] = parseInt(optEl.dataset.oi);
            renderContent();
          };
        });
      }
      content.appendChild(card);
    });
  }

  if(sec==='tf'){
    order.forEach((idx, pos)=>{
      const item = DATA[mod].tf[idx];
      const key = `${mod}_tf_${idx}`;
      const chosen = state.answers[key];
      const card = document.createElement('div');
      card.className='card';
      const trueCls = chosen!==undefined ? (item.ans===true ? 'correct' : (chosen===true ? 'wrong' : '')) : '';
      const falseCls = chosen!==undefined ? (item.ans===false ? 'correct' : (chosen===false ? 'wrong' : '')) : '';
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${item.q}</p>
        <div class="tf-row">
          <button class="tf-btn ${trueCls}" data-val="true" ${chosen!==undefined?'disabled':''}>✔ True</button>
          <button class="tf-btn ${falseCls}" data-val="false" ${chosen!==undefined?'disabled':''}>✘ False</button>
        </div>
        <div class="explain ${(chosen!==undefined && item.fix) ? 'show':''}">${item.fix}</div>
      `;
      if(chosen===undefined){
        card.querySelectorAll('.tf-btn').forEach(btn=>{
          btn.onclick = ()=>{
            state.answers[key] = (btn.dataset.val==='true');
            renderContent();
          };
        });
      }
      content.appendChild(card);
    });
  }
}

function renderStudy(){
  renderRail();
  renderSubnav();
  renderContent();
}

/* ================= EXAM MODE ================= */
let exam = {
  scope: 'all',      // 'all' | 'm1' | 'm2' | 'm3'
  questions: [],       // [{mod, sec, idx, optOrder?}]
  answers: {},         // examKey -> chosen
  submitted: false
};

function examKey(item){ return `${item.mod}_${item.sec}_${item.idx}`; }

function buildExam(scope){
  exam.scope = scope;
  exam.answers = {};
  exam.submitted = false;
  const mods = scope==='all' ? ['m1','m2','m3'] : [scope];
  let items = [];
  mods.forEach(mod=>{
    DATA[mod].mcq.forEach((_,idx)=> items.push({mod, sec:'mcq', idx}));
    DATA[mod].tf.forEach((_,idx)=> items.push({mod, sec:'tf', idx}));
  });
  items = shuffle(items);
  items.forEach(it=>{
    if(it.sec==='mcq') it.optOrder = shuffle([0,1,2,3]);
  });
  exam.questions = items;
  // essays included separately, shuffled, for self-review
  let essayItems = [];
  mods.forEach(mod=>{
    DATA[mod].essay.forEach((_,idx)=> essayItems.push({mod, idx}));
  });
  exam.essayQuestions = shuffle(essayItems);
}

function renderExamSetup(){
  const view = document.getElementById('examView');
  view.innerHTML = `
    <div class="exam-setup">
      <h2>Ready to test yourself?</h2>
      <p>Pick a scope. Questions and answer order are freshly shuffled every time — no memorizing positions.</p>
      <div class="exam-scope" id="examScope">
        <button data-scope="all" class="active">All Modules</button>
        <button data-scope="m1">Module 1</button>
        <button data-scope="m2">Module 2</button>
        <button data-scope="m3">Module 3</button>
      </div>
      <button class="start-exam-btn" id="startExamBtn">Start Exam</button>
    </div>
  `;
  let chosenScope = 'all';
  view.querySelectorAll('#examScope button').forEach(btn=>{
    btn.onclick = ()=>{
      view.querySelectorAll('#examScope button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      chosenScope = btn.dataset.scope;
    };
  });
  document.getElementById('startExamBtn').onclick = ()=>{
    buildExam(chosenScope);
    renderExamRun();
  };
}

function renderExamRun(){
  const view = document.getElementById('examView');
  view.innerHTML = '';

  if(!exam.submitted){
    const progress = document.createElement('div');
    const answeredCount = Object.keys(exam.answers).length;
    progress.className='exam-progress';
    progress.textContent = `${answeredCount} / ${exam.questions.length} answered`;
    view.appendChild(progress);
  } else {
    let correct = 0;
    exam.questions.forEach(item=>{
      const key = examKey(item);
      const chosen = exam.answers[key];
      const data = DATA[item.mod][item.sec][item.idx];
      const right = item.sec==='mcq' ? data.correct : data.ans;
      if(chosen===right) correct++;
    });
    const total = exam.questions.length;
    const pct = total ? Math.round((correct/total)*100) : 0;
    const resultDiv = document.createElement('div');
    resultDiv.className='exam-result';
    resultDiv.innerHTML = `
      <div class="big-score mono">${correct}/${total}</div>
      <p>${pct}% correct — review the breakdown below.</p>
      <button class="retake-btn" id="retakeBtn">Take another exam</button>
    `;
    view.appendChild(resultDiv);
    resultDiv.querySelector('#retakeBtn').onclick = renderExamSetup;
  }

  let lastLabel = '';
  exam.questions.forEach((item,pos)=>{
    const label = `${DATA[item.mod].title} — ${item.sec==='mcq'?'Multiple Choice':'True / False'}`;
    if(label !== lastLabel){
      const lab = document.createElement('div');
      lab.className='exam-section-label';
      lab.textContent = label;
      view.appendChild(lab);
      lastLabel = label;
    }
    const data = DATA[item.mod][item.sec][item.idx];
    const key = examKey(item);
    const chosen = exam.answers[key];
    const card = document.createElement('div');
    card.className='card';

    if(item.sec==='mcq'){
      const right = data.correct;
      let optsHtml = item.optOrder.map((origOi,pos2)=>{
        let cls='opt';
        if(exam.submitted){
          cls+=' disabled';
          if(origOi===right) cls+=' correct';
          else if(origOi===chosen) cls+=' wrong';
        } else if(origOi===chosen){
          cls+=' chosen';
        }
        return `<div class="${cls}" data-oi="${origOi}"><span class="tag mono">${LETTERS[pos2]}</span><span>${data.opts[origOi]}</span></div>`;
      }).join('');
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${data.q}</p>
        ${optsHtml}
        <div class="explain ${exam.submitted?'show':''}">${data.exp}</div>
      `;
      if(!exam.submitted){
        card.querySelectorAll('.opt').forEach(optEl=>{
          optEl.onclick = ()=>{
            exam.answers[key] = parseInt(optEl.dataset.oi);
            renderExamRun();
          };
        });
      }
    } else {
      const right = data.ans;
      const trueCls = exam.submitted ? (right===true?'correct':(chosen===true?'wrong':'')) : (chosen===true?'chosen':'');
      const falseCls = exam.submitted ? (right===false?'correct':(chosen===false?'wrong':'')) : (chosen===false?'chosen':'');
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${data.q}</p>
        <div class="tf-row">
          <button class="tf-btn ${trueCls}" data-val="true" ${exam.submitted?'disabled':''}>✔ True</button>
          <button class="tf-btn ${falseCls}" data-val="false" ${exam.submitted?'disabled':''}>✘ False</button>
        </div>
        <div class="explain ${(exam.submitted && data.fix) ? 'show':''}">${data.fix}</div>
      `;
      if(!exam.submitted){
        card.querySelectorAll('.tf-btn').forEach(btn=>{
          btn.onclick = ()=>{
            exam.answers[key] = (btn.dataset.val==='true');
            renderExamRun();
          };
        });
      }
    }
    view.appendChild(card);
  });

  // Essay section
  if(exam.essayQuestions && exam.essayQuestions.length){
    const lab = document.createElement('div');
    lab.className='exam-section-label';
    lab.textContent = 'Essay Questions (self-review)';
    view.appendChild(lab);
    exam.essayQuestions.forEach((eitem,pos)=>{
      const data = DATA[eitem.mod].essay[eitem.idx];
      const card = document.createElement('div');
      card.className='card';
      const ansId = `examessay_${eitem.mod}_${eitem.idx}`;
      card.innerHTML = `
        <span class="q-index mono">Question ${pos+1}</span>
        <p class="q-text">${data.q}</p>
        ${exam.submitted ? `<button class="essay-toggle" data-target="${ansId}">Show model answer ▾</button><div class="essay-ans" id="${ansId}">${data.a}</div>` : `<p style="color:var(--ink-soft); font-size:13.5px;">Model answer unlocks after you submit the exam.</p>`}
      `;
      view.appendChild(card);
    });
    if(exam.submitted){
      view.querySelectorAll('.essay-toggle').forEach(btn=>{
        btn.onclick = ()=>{
          const el = document.getElementById(btn.dataset.target);
          const showing = el.classList.toggle('show');
          btn.textContent = showing ? 'Hide answer ▴' : 'Show model answer ▾';
        };
      });
    }
  }

  if(!exam.submitted){
    const submitBtn = document.createElement('button');
    submitBtn.className='submit-exam-btn';
    submitBtn.textContent='Submit Exam';
    submitBtn.onclick = ()=>{ exam.submitted = true; renderExamRun(); window.scrollTo({top:0, behavior:'smooth'}); };
    view.appendChild(submitBtn);
  }
}

/* ================= MODE SWITCH ================= */
document.querySelectorAll('#modeToggle button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('#modeToggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    document.getElementById('studyView').style.display = state.mode==='study' ? 'block':'none';
    document.getElementById('examView').style.display = state.mode==='exam' ? 'block':'none';
    if(state.mode==='exam') renderExamSetup();
  };
});

/* ================= EVENTS ================= */
document.getElementById('themeBtn').onclick = ()=>{
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme==='light' ? '🌙 Dark' : '☀️ Light';
};
document.getElementById('resetBtn').onclick = ()=>{
  reshuffleSection(state.module, state.section);
  renderStudy();
};

renderStudy();
</script>
